apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-pg-local
  labels:
    app.kubernetes.io/part-of: k3s-keycloak-kit
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "1"
  dataLocality: strict-local
  staleReplicaTimeout: "2880"
  fsType: ext4
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-rwo-3replicas
  labels:
    app.kubernetes.io/part-of: k3s-keycloak-kit
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "3"
  staleReplicaTimeout: "2880"
  fsType: ext4
